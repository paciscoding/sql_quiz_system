services:
  db:
    image: postgres:15-alpine
    container_name: sql-quiz-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./company_elmasri_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    # `image` + `build` together: CI pushes this tag to GHCR and the VPS pulls it,
    # while local `docker compose up --build` still builds from ./backend as before.
    # image: ghcr.io/paciscoding/sql-quiz-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql-quiz-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Password for the restricted quiz_exec login role student SQL runs as
      # (ARCH-025). Backend log.Fatal-s on boot if unset. Must match the
      # password quiz_exec was created with in the DB.
      STUDENT_DB_PASSWORD: ${STUDENT_DB_PASSWORD}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      ID_SALT: ${ID_SALT}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS}
      EMAIL_SENDER_APP_PASSWORD: ${EMAIL_SENDER_APP_PASSWORD}
      PASSWORD_LOG_KEY: ${PASSWORD_LOG_KEY}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SUBMISSION_EXPORT_ENABLED: ${SUBMISSION_EXPORT_ENABLED:-true}
      SUBMISSION_EXPORT_INTERVAL: ${SUBMISSION_EXPORT_INTERVAL:-24h}
      EXPORT_ADMIN_EMAIL: ${EXPORT_ADMIN_EMAIL:-}
    restart: always

  frontend:
    # image: ghcr.io/paciscoding/sql-quiz-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # dockerfile: Dockerfile.caddy
    container_name: sql-quiz-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /opt/nginx/certs:/etc/nginx/certs:ro
    restart: always

volumes:
  postgres_data:

# Log the path only ($uri), never $request: $request carries the query string, and
# the exam SSE stream passes the JWT as ?access_token=..., which would then be written
# to disk. The access_log directive is set INSIDE each server block below, NOT here:
# the stock nginx.conf this file is included into already declares an http-level
# `access_log ... main;`, and nginx writes to ALL same-level access_log directives (it
# does not override). Only a server-level access_log suppresses the inherited main log.
# log_format is valid at http level only, so it stays here.
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log scrubbed;
  return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log scrubbed;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; frame-ancestors 'self';";

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Caching for static assets
        # No add_header here: nginx does not merge add_header across levels, so any
        # add_header would drop the server-block security headers on every static
        # asset. `expires 30d` emits Cache-Control on its own.
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
            expires 30d;
        }
    }

    # SSE passthrough for exam status stream — must appear before the generic /api/ block
    # so Nginx matches this regex location first. proxy_buffering off is critical for SSE.
    location ~ ^/api/v1/quiz/exams/[0-9]+/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        proxy_set_header Connection "";
    }

    # Proxy API requests to the Go backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove WebSocket upgrade headers as this is a non-WebSocket REST proxy
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        
        proxy_cache_bypass $http_upgrade;
    }
}
